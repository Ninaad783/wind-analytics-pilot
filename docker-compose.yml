version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wind_forecast_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - ELEXON_API_KEY=${ELEXON_API_KEY:-}
      - RATE_LIMIT_PER_MINUTE=240
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:80","http://127.0.0.1:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - analytics_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: wind_forecast_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - analytics_network

networks:
  analytics_network:
    driver: bridge
